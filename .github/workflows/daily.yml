name: 毎日サイトを自動更新

on:
  schedule:
    # UTC 21:00 = JST 6:00。売れ筋ランキングが前日分で確定した頃に回す
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # 手動実行用
  push:
    branches: [main]
    paths:
      - "config/**"
      - "templates/**"
      - "static/**"
      - "src/**"
      - "main.py"

permissions:
  contents: read
  pages: write
  id-token: write

# 前の実行が走っている最中に次が始まるとデプロイが競合する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # アクションはタグではなくコミットSHAで固定する。
      # タグは付け替え可能なので、@v7 のままだと参照先の中身を差し替えられ得る。
      # このジョブには楽天のアクセスキーが渡るため、実行するコードを固定しておく。
      # 更新は .github/dependabot.yml が出すPRで行う（コメントのバージョンも追随する）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # 固定したバージョン以外を絶対に入れない
      - run: pip install --no-deps -r requirements.txt

      - name: 楽天APIから記事を生成
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          # 公開ページのmetaタグに出る値なので Secret ではなく Variable でよい
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: python main.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
